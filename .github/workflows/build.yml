name: Build Level Recorder

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: level-recorder
          path: build/*.geode
